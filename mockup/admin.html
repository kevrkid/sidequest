<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Side Quest Admin</title>
<style>
  :root{--bg:#070b18;--panel:#10162c;--panel2:#18203f;--line:#253058;--text:#e9edff;--muted:#8a93ba;--accent:#ff7a18;--good:#3ddc97;--bad:#ff3b5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}
  main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0} h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .meta{color:var(--muted);font-size:12px}
  input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;font:inherit;min-width:260px}
  button{font:inherit;font-weight:700;border-radius:10px;padding:6px 11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  button.bad{border-color:var(--bad);color:#ff8a9c} button.good{border-color:var(--good);color:var(--good)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .stat b{display:block;font-size:22px}
  img{max-width:120px;border-radius:8px;display:block;margin-top:6px}
  .grow{flex:1;min-width:0}
</style>
</head>
<body><main>
<div class="row"><h1 class="grow">🛡️ Side Quest admin</h1><a href="/" style="color:#2ec5ff">← app</a></div>
<form id="login" class="row" style="margin-top:14px"><input id="tok" type="password" placeholder="Admin token (SQ_ADMIN_TOKEN)" autocomplete="off"><button>Open</button></form>
<p id="err" style="color:#ff8a9c"></p>
<div id="out"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = t => new Date(t).toLocaleString();
let TOK = sessionStorage.getItem('sq-admin') || '';
async function call(method, body){
  const r = await fetch('/api/admin', {method, headers:{'X-Admin-Token':TOK, 'Content-Type':'application/json'}, body: body && JSON.stringify(body)});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function load(){
  try{
    const d = await call('GET'); $('#err').textContent=''; $('#login').hidden = true;
    const act = (label, o, cls='') => `<button class="${cls}" data-act='${esc(JSON.stringify(o))}'>${label}</button>`;
    const open = d.reports.filter(r=>r.status==='open');
    let g=null; try{ const r=await fetch('/api/admin/growth',{headers:{'X-Admin-Token':TOK}}); if(r.ok) g=await r.json(); }catch(e){}
    const max=g?Math.max(1,...g.dau):1;
    const hp = d.health, hOld = hp && Date.now()/1000 - hp.at > 20*60;
    $('#out').innerHTML = `${hp&&(hp.problems.length||hOld)?`<div class="card" style="border:1px solid #ff5d5d;background:rgba(255,93,93,.08)"><b>⚠️ Server health</b> · checked ${when(hp.at*1000)}${hOld?' (the check itself has stopped running)':''}
        ${hp.problems.map(p=>`<div>${esc(p)}</div>`).join('')}</div>`:hp?`<p class="meta">✅ Server healthy · checked ${when(hp.at*1000)}</p>`:''}
      <div class="stats">${Object.entries(d.stats).map(([k,v])=>`<div class="stat"><b>${v}</b><span class="meta">${k.replace('_',' ')}</span></div>`).join('')}</div>
      ${g?`<h2>📈 Growth (last 14 days)</h2>
      <div class="stats"><div class="stat"><b>${g.dau.at(-1)}</b><span class="meta">active today</span></div><div class="stat"><b>${g.wau}</b><span class="meta">active this week</span></div>
        <div class="stat"><b>${g.retention7==null?'–':g.retention7+'%'}</b><span class="meta">came back in week 2${g.cohort?` (of ${g.cohort})`:''}</span></div>
        <div class="stat"><b>${g.signups.reduce((a,b)=>a+b,0)}</b><span class="meta">sign-ups</span></div><div class="stat"><b>${g.rsvps}</b><span class="meta">RSVPs</span></div>
        <div class="stat"><b>${g.checkins}</b><span class="meta">check-ins</span></div><div class="stat"><b>${g.quests_done}</b><span class="meta">quests done</span></div></div>
      <div class="card"><div class="meta">Daily active people</div><div style="display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:6px">${g.dau.map((n,i)=>`<div title="${esc(g.days[i])}: ${n}" style="flex:1;background:#2ec5ff;border-radius:3px 3px 0 0;height:${Math.max(2,n/max*100)}%"></div>`).join('')}</div>
        <div class="meta" style="display:flex;justify-content:space-between"><span>${esc(g.days[0])}</span><span>${esc(g.days.at(-1))}</span></div></div>
      <div class="card"><div class="meta">What people did (taps, 14 days; no content or locations are recorded)</div>${Object.entries(g.events).slice(0,14).map(([k,v])=>`<div class="row"><span class="grow">${esc(k.replace(/_/g,' '))}</span><b>${v}</b></div>`).join('')||'<p class="meta">Nothing yet.</p>'}</div>`:''}
      <h2>Open reports (${open.length})</h2>
      ${open.map(r=>`<div class="card row"><div class="grow"><b>${esc(r.reason)}</b> · ${esc(r.kind)} <code>${esc(r.target)}</code>${r.about?` by @${esc(r.about)}`:''}
          <div class="meta">reported by @${esc(r.by)} · ${when(r.at)}</div></div>
        ${r.kind==='user'?act('Ban user',{action:'ban',h:r.target},'bad')
          :r.kind==='stream'?(r.about?act('End stream',{action:'end_stream',h:r.about},'bad')+act('Suspend @'+esc(r.about),{action:'ban',h:r.about},'bad'):'')
          :r.kind==='chat'?act('Remove message',{action:'remove',kind:'evchat',id:r.target},'bad')+(r.about?act('Suspend @'+esc(r.about),{action:'ban',h:r.about},'bad'):'')
          :act('Remove '+r.kind,{action:'remove',kind:r.kind,id:r.target},'bad')}
        ${act('Resolve',{action:'resolve',id:r.id},'good')}</div>`).join('') || '<p class="meta">Nothing open. 🎉</p>'}
      <h2>📺 Live now (${d.live.length})</h2>
      <p class="meta">${d.livekit?'Video goes through LiveKit.':'LiveKit is not set up, so video goes straight from phone to phone.'}
        End stream stops it for every viewer and keeps that person off Live for 30 minutes. Suspend also signs them out.</p>
      ${d.live.map(s=>`<div class="card row"><div class="grow"><b>@${esc(s.h)}</b> · ${esc(s.title)}
          <div class="meta">since ${when(s.started)} · 👁 ${s.viewers} · ${s.livekit?'LiveKit':'phone to phone'} · stream <code>${esc(s.id)}</code></div></div>
        ${act('End stream',{action:'end_stream',h:s.h},'bad')}${act('Suspend @'+esc(s.h),{action:'ban',h:s.h},'bad')}</div>`).join('') || '<p class="meta">Nobody is live.</p>'}
      ${d.live_stopped.length?`<p class="meta">Stopped in the last 30 minutes: ${d.live_stopped.map(x=>`@${esc(x.h)} (${when(x.at)})`).join(', ')}</p>`:''}
      <h2>Needs a human look</h2>
      <p class="meta">${d.photo_screen?'Photos are screened by Claude right after they go up; what is left here went up while screening was unavailable, or is still waiting.':'Photo screening is off (SQ_MODERATE=0 or SQ_PHOTO_SCREEN=0), so every photo waits here.'}</p>
      ${d.unreviewed.stories.map(x=>`<div class="card row"><div class="grow"><b>Story</b> by @${esc(x.u)} · ${when(x.created)}<div>${esc(x.caption)}</div>${x.img?`<img src="${esc(x.img)}" alt="">`:''}</div>
        ${act('Looks fine',{action:'approve',kind:'story',id:x.id},'good')}${act('Remove',{action:'remove',kind:'story',id:x.id},'bad')}${act('Ban @'+esc(x.u),{action:'ban',h:x.u},'bad')}</div>`).join('')}
      ${d.unreviewed.posts.map(x=>`<div class="card row"><div class="grow"><b>Post</b> by @${esc(x.u)}<div>${esc(x.t)}</div></div>
        ${act('Looks fine',{action:'approve',kind:'post',id:x.id},'good')}${act('Remove',{action:'remove',kind:'post',id:x.id},'bad')}</div>`).join('')}
      ${d.unreviewed.groups.map(x=>`<div class="card row"><div class="grow"><b>Group</b> ${esc(x.n)} by @${esc(x.owner)}<div class="meta">${esc(x.d)}</div></div>
        ${act('Looks fine',{action:'approve',kind:'group',id:x.id},'good')}${act('Remove',{action:'remove',kind:'group',id:x.id},'bad')}</div>`).join('')}
      ${(d.unreviewed.evchat||[]).map(x=>`<div class="card row"><div class="grow"><b>Event chat</b> by @${esc(x.u)} · <code>${esc(x.ev)}</code><div>${esc(x.t)}</div></div>
        ${act('Looks fine',{action:'approve',kind:'evchat',id:x.id},'good')}${act('Remove',{action:'remove',kind:'evchat',id:x.id},'bad')}</div>`).join('')}
      ${(d.unreviewed.wall||[]).map(x=>`<div class="card row"><div class="grow"><b>Public post</b> by @${esc(x.u)} · ${when(x.at)}${x.vis==='friends'?' · friends only':''}<div>${esc(x.t)}</div>${x.img&&x.vis!=='friends'?`<img src="${esc(x.img)}" alt="">`:x.img?'<div class="meta">📷 photo (friends only, not shown here)</div>':''}</div>
        ${act('Looks fine',{action:'approve',kind:'wall',id:x.id},'good')}${act('Remove',{action:'remove',kind:'wall',id:x.id},'bad')}${act('Ban @'+esc(x.u),{action:'ban',h:x.u},'bad')}</div>`).join('')}
      ${(d.unreviewed.gposts||[]).map(x=>`<div class="card row"><div class="grow"><b>Group post</b> by @${esc(x.u)} · ${when(x.at)} · <code>${esc(x.g)}</code><div>${esc(x.t)}</div>${x.img?'<div class="meta">📷 photo (open the group to see it)</div>':''}</div>
        ${act('Looks fine',{action:'approve',kind:'gpost',id:x.id},'good')}${act('Remove',{action:'remove',kind:'gpost',id:x.id},'bad')}${act('Ban @'+esc(x.u),{action:'ban',h:x.u},'bad')}</div>`).join('')}
      ${(d.unreviewed.pics||[]).map(x=>`<div class="card row"><div class="grow"><b>Profile picture</b> of @${esc(x.h)}<img src="/avatar/${encodeURIComponent(x.h)}.jpg?v=${encodeURIComponent(x.pic)}" alt=""></div>
        ${act('Looks fine',{action:'approve',kind:'pic',id:x.h},'good')}${act('Remove',{action:'remove',kind:'pic',id:x.h},'bad')}${act('Ban @'+esc(x.h),{action:'ban',h:x.h},'bad')}</div>`).join('')}
      ${(d.unreviewed.profiles||[]).map(x=>`<div class="card row"><div class="grow"><b>Profile answers</b> of @${esc(x.h)} <span class="meta">(couldn't be checked; hidden from others until a re-check or you)</span><div>${esc(x.t)}</div></div>
        ${act('Looks fine',{action:'approve',kind:'profile',id:x.h},'good')}${act('Clear them',{action:'remove',kind:'profile',id:x.h},'bad')}${act('Ban @'+esc(x.h),{action:'ban',h:x.h},'bad')}</div>`).join('')}
      ${(d.unreviewed.profiles||[]).length+d.unreviewed.stories.length+d.unreviewed.posts.length+d.unreviewed.groups.length+(d.unreviewed.evchat||[]).length+(d.unreviewed.wall||[]).length+(d.unreviewed.gposts||[]).length+(d.unreviewed.pics||[]).length?'':'<p class="meta">All clear.</p>'}
      ${(d.photo_blocks||[]).length?`<h2>🛡️ Photos taken down automatically</h2>${d.photo_blocks.map(x=>`<div class="card"><b>${esc(x.kind)}</b> by @${esc(x.u)} · ${when(x.at)}<div class="meta">${esc(x.reason)}</div></div>`).join('')}`:''}
      <h2>🧭 Scout usage</h2>
      ${d.scout?`<div class="card row"><div class="grow"><b>${d.scout.paused?'Paused by you':d.scout.over_budget?"Paused: today's budget is used up":'Running'}</b>
          <div class="meta">Daily budget $${d.scout.budget} for everyone · ${d.scout.daily_limit} questions per person per day</div></div>
        ${d.scout.paused?act('Resume Scout',{action:'scout_resume'},'good'):act('Pause Scout',{action:'scout_pause'},'bad')}</div>
      ${d.scout.days.map(x=>`<div class="card"><b>${esc(x.day)}</b> · ${x.n} questions · $${x.usd}
          <div class="meta">${x.top.map(u=>`@${esc(u.h)} ${u.n} ($${u.usd})`).join(' · ')||'nobody yet'}</div></div>`).join('') || '<p class="meta">No questions yet.</p>'}`:''}
      <h2>Feedback (${d.feedback.length})</h2>
      ${d.feedback.map(f=>`<div class="card"><div>${esc(f.text)}</div><div class="meta">@${esc(f.by)} · ${esc(f.where)} · ${when(f.at)}</div></div>`).join('') || '<p class="meta">None yet.</p>'}
      <h2>People (${d.users.length})</h2>
      ${d.users.map(u=>`<div class="card row"><div class="grow"><b>@${esc(u.h)}</b> ${u.banned?'<span style="color:#ff8a9c">suspended</span>':''}
          <div class="meta">joined ${esc(u.joined)}${u.invite?` · invite ${esc(u.invite)}`:''}</div></div>
        ${u.banned?act('Unban',{action:'unban',h:u.h},'good'):act('Suspend',{action:'ban',h:u.h},'bad')}${act('Delete account',{action:'delete_user',h:u.h},'bad')}</div>`).join('')}`;
  }catch(e){ $('#err').textContent = e.message; $('#login').hidden = false; }
}
$('#login').onsubmit = e => { e.preventDefault(); TOK = $('#tok').value.trim(); sessionStorage.setItem('sq-admin', TOK); load(); };
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const o = JSON.parse(b.dataset.act);
  if(/ban|delete|remove|end_stream/.test(o.action) && !confirm(`${o.action.replace('_',' ')} ${o.h||o.id}?`)) return;
  try{ await call('POST', o); load(); }catch(err){ alert(err.message); }
});
if(TOK) load();
</script>
</main></body>
</html>
